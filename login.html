<script>
// 旧URL（kabuyt.github.io/trainee-manager/…）から新しい実習生管理（kanri）へ転送する（2026-10-06）
(function () {
  var base = 'https://kanri.gropvietnam.com.vn/';
  var map = {
    '': 'trainee/', 'index.html': 'trainee/', 'kumiai.html': 'trainee/', 'download.html': 'trainee/',
    'login.html': 'login.html',
    'trainee.html': 'trainee/trainee.html', 'register.html': 'trainee/register.html',

    'terminology-progress.html': 'trainee/terminology-progress.html'
  };
  var path = location.pathname.replace(/^\/trainee-manager\/?/, '');
  var dest = map.hasOwnProperty(path) ? map[path] : '';
  var keep = /\.html$/.test(dest) ? location.search + location.hash : '';
  location.replace(base + dest + keep);
})();
</script>
