<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回答詳細</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:#f5f6fa;color:#333;font-size:14px;padding-bottom:40px}
  .nav{background:#2c3e50;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:100}
  .nav a{color:#bdc3c7;text-decoration:none;font-size:13px;padding:4px 10px;border-radius:4px}
  .nav a:hover{background:#34495e;color:#fff}
  .nav h1{font-size:16px;font-weight:bold}

  .container{padding:14px;max-width:900px;margin:0 auto}

  .card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:14px 18px;margin-bottom:12px}
  .card h2{font-size:15px;color:#2c3e50;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #eaf0fb}

  .info-grid{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:13px}
  .info-grid dt{color:#777}

  .scores{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .score-card{flex:1;min-width:120px;background:#eaf0fb;padding:10px 14px;border-radius:6px;text-align:center}
  .score-card b{display:block;font-size:22px;color:#1a5276}
  .score-card span{font-size:11px;color:#777}

  .section-title{font-size:14px;font-weight:bold;color:#1a5276;margin:12px 0 8px;padding:6px 10px;background:#eaf0fb;border-radius:4px}

  .q-item{background:#f8f9fa;border-left:4px solid #ccc;padding:8px 12px;margin:6px 0;border-radius:4px;font-size:13px}
  .q-item.correct{border-left-color:#27ae60;background:#e8f5e9}
  .q-item.wrong{border-left-color:#e74c3c;background:#ffebee}
  .q-item.unanswered{border-left-color:#f39c12;background:#fffde7}
  .q-item.manual{border-left-color:#3498db;background:#e3f2fd}
  .q-item .qlabel{font-weight:bold;font-size:12px;color:#555}
  .q-item .userAns{margin-top:4px;font-size:14px;padding:4px 8px;background:#fff;border-radius:3px;border:1px solid #ddd}
  .q-item .correctAns{margin-top:3px;font-size:12px;color:#27ae60}
  .q-item .correctAns.wrong{color:#e74c3c}
  .badge-ok{background:#27ae60;color:#fff;padding:1px 6px;border-radius:8px;font-size:11px}
  .badge-ng{background:#e74c3c;color:#fff;padding:1px 6px;border-radius:8px;font-size:11px}
  .badge-na{background:#95a5a6;color:#fff;padding:1px 6px;border-radius:8px;font-size:11px}
  .badge-mn{background:#3498db;color:#fff;padding:1px 6px;border-radius:8px;font-size:11px}

  .raw{background:#263238;color:#aed581;padding:10px;border-radius:5px;font-family:monospace;font-size:11px;max-height:200px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .toggle{font-size:12px;color:#3498db;cursor:pointer;margin-top:8px;display:inline-block}
  .btn{padding:6px 14px;border:none;border-radius:5px;font-size:13px;cursor:pointer;background:#3498db;color:#fff}
  .btn:hover{background:#2980b9}
  .manual-panel{border-left:5px solid #3498db}
  .manual-summary{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  .manual-summary .pill{background:#e3f2fd;color:#1a5276;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:bold}
  .manual-row{display:grid;grid-template-columns:90px 1fr 110px;gap:10px;align-items:start;background:#f8fbff;border:1px solid #d7e8f7;border-radius:6px;padding:10px;margin:8px 0}
  .manual-row .fid{font-weight:bold;color:#1a5276;font-size:12px}
  .manual-row .question{background:#eef6ff;border:1px solid #cfe3f6;border-radius:4px;padding:7px 8px;margin-bottom:6px;line-height:1.7}
  .manual-row .passage{background:#fff;border:1px solid #e5edf6;border-radius:4px;padding:8px;margin-bottom:6px;max-height:180px;overflow:auto;line-height:1.7}
  .manual-row .answer{background:#fff;border:1px solid #ddd;border-radius:4px;padding:6px 8px;min-height:32px;white-space:pre-wrap}
  .manual-blank{display:inline-block;background:#fff;border:1px solid #7fb3d5;border-radius:3px;padding:0 8px;color:#1a5276;font-weight:bold}
  .manual-row input{width:70px;padding:5px;border:1px solid #aaa;border-radius:4px;text-align:right}
  .manual-binary{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .manual-binary button{padding:6px 10px;border:1px solid #bbb;border-radius:999px;background:#fff;color:#555;font-size:12px;cursor:pointer}
  .manual-binary button.active-ok{background:#27ae60;border-color:#27ae60;color:#fff}
  .manual-binary button.active-ng{background:#e74c3c;border-color:#e74c3c;color:#fff}
  .manual-binary button.active-auto{background:#95a5a6;border-color:#95a5a6;color:#fff}
  .manual-save{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px}
  .manual-note{font-size:12px;color:#666;line-height:1.6}
  @media(max-width:640px){.manual-row{grid-template-columns:1fr}.manual-save{justify-content:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>

<div class="nav">
  <h1>📝 回答詳細</h1>
  <a href="test-results.html">← 一覧に戻る</a>
  <span style="margin-left:auto">
    <button class="btn" onclick="window.print()">🖨 印刷</button>
  </span>
</div>

<div class="container">
  <div id="content">
    <div class="card">
      <p>読み込み中…</p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="test-result-detail-overrides.js?v=20260720-g2-binary"></script>
<script>
const params = new URLSearchParams(location.search);
const RESULT_ID = params.get('id');

(async () => {
  // 認証確認
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    location.href = 'test-results.html';
    return;
  }

  if (!RESULT_ID) {
    document.getElementById('content').innerHTML = '<div class="card"><p style="color:red">?id=xxx が必要です</p></div>';
    return;
  }

  // 結果取得
  const { data: result, error } = await supabase
    .from('test_results')
    .select('*,trainees(student_id,name_katakana,name_romaji,class_group,company)')
    .eq('id', RESULT_ID)
    .single();

  // 結果取得後にグローバルにも保持（除外操作用）
  window._currentResult = result;

  if (error || !result) {
    document.getElementById('content').innerHTML = `<div class="card"><p style="color:red">取得失敗: ${error?.message || '不明'}</p></div>`;
    return;
  }

  // 問題データと答え・採点ルールを取得
  const { data: sections } = await supabase
    .from('test_sections')
    .select('section_type,questions,answer_key,scoring_rules')
    .eq('test_id', result.test_name);

  // テスト定義
  const { data: testDef } = await supabase
    .from('test_definitions').select('*').eq('id', result.test_name).single();

  renderDetail(result, sections || [], testDef || {});
})();

function renderDetail(result, sections, testDef) {
  const t = result.trainees || {};
  const answers = result.answers_json || {};
  const manualScores = manualScoresFromResult(result);
  window._detailSections = sections || [];
  window._detailTestDef = testDef || {};
  window._detailAnswers = answers || {};
  const total = (result.score_vocab||0) + (result.score_grammar||0) + (result.score_listening||0);
  const max = (testDef.sections || ['goii','bunpo','chokkai']).length * 100;

  let html = '';

  // 除外バナー（excluded=true なら最上部に表示）
  if (result.excluded) {
    html += `<div class="card" style="background:#fdedeb;border-left:6px solid #c0392b;padding:14px 18px">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="flex:1">
          <div style="font-size:16px;font-weight:bold;color:#c0392b">⚠ このテスト結果は除外されています</div>
          <div style="font-size:13px;color:#555;margin-top:4px">理由: ${escapeHtml(result.excluded_reason || '(未記入)')}</div>
          <div style="font-size:12px;color:#888;margin-top:4px">レポート・グラフ・curriculum 判定からは除外されますが、データは保持されています。</div>
        </div>
        <button class="btn" style="background:#3498db" onclick="restoreResult()">↶ 復元する</button>
      </div>
    </div>`;
  } else {
    html += `<div style="text-align:right;margin-bottom:8px">
      <button class="btn" style="background:#e74c3c" onclick="excludeResult()">🚫 誤受験として除外</button>
    </div>`;
  }

  // 基本情報
  html += `<div class="card">
    <h2>基本情報</h2>
    <dl class="info-grid">
      <dt>学生ID</dt><dd>${t.student_id || '-'}</dd>
      <dt>名前</dt><dd>${t.name_katakana || ''} ${t.name_romaji ? '('+t.name_romaji+')' : ''}</dd>
      <dt>クラス / 会社</dt><dd>${t.class_group || '-'} / ${t.company || '-'}</dd>
      <dt>テスト</dt><dd>${result.test_name} - ${testDef.display_name || ''}</dd>
      <dt>受験日</dt><dd>${result.test_date}</dd>
      <dt>提出日時</dt><dd>${result.created_at}</dd>
      <dt>採点方式</dt><dd>${result.auto_scored ? '自動採点' : '先生手動'}</dd>
    </dl>
    <div class="scores">
      ${result.score_vocab !== null ? `<div class="score-card"><b>${result.score_vocab}</b><span>語彙 /100</span></div>` : ''}
      ${result.score_grammar !== null ? `<div class="score-card"><b>${result.score_grammar}</b><span>文法 /100</span></div>` : ''}
      ${result.score_listening !== null ? `<div class="score-card"><b>${result.score_listening}</b><span>聴解 /100</span></div>` : ''}
      <div class="score-card" style="background:#1a5276;color:#fff"><b style="color:#fff">${total}</b><span style="color:#eee">合計 /${max}</span></div>
    </div>
  </div>`;

  // セクション別
  const secNames = { goii: '語彙テスト', bunpo: '文法テスト', chokkai: '聴解テスト' };
  sections.sort((a,b)=> ['goii','bunpo','chokkai'].indexOf(a.section_type) - ['goii','bunpo','chokkai'].indexOf(b.section_type));
  const manualItems = collectManualScoringItems(sections, answers);
  if (manualItems.length) {
    html += renderManualScoringPanel(result, manualItems);
  }
  sections.forEach(sec => {
    html += `<div class="card"><h2>${secNames[sec.section_type] || sec.section_type}</h2>`;
    html += renderQuestions(sec.section_type, sec.questions || [], sec.answer_key || {}, sec.scoring_rules || {}, answers, manualScores);
    html += `</div>`;
  });

  // 生データ
  html += `<div class="card">
    <h2>生データ（デバッグ用）</h2>
    <span class="toggle" onclick="document.getElementById('raw').style.display = document.getElementById('raw').style.display==='none'?'block':'none'">▼ 表示切替</span>
    <div id="raw" class="raw" style="display:none;margin-top:8px">${escapeHtml(JSON.stringify(answers, null, 2))}</div>
  </div>`;

  document.getElementById('content').innerHTML = html;
  updateManualTotals();
  if (window.DetailOverrides && typeof window.DetailOverrides.init === 'function') {
    window.DetailOverrides.init({
      result,
      sections: sections || [],
      answers: answers || {},
      testDef: testDef || {},
      helpers: { stripRuby, escapeHtml, collectFieldIds, buildManualQuestionContext, manualScoresFromResult, manualTotals }
    });
  }
}

function renderQuestions(sectionType, questions, answerKey, scoringRules, userAnswers, manualScores) {
  let html = '';
  questions.forEach(q => {
    html += `<div style="margin-top:14px"><div class="section-title">${stripRuby(q.title_html || q.id)}</div>`;
    const rule = scoringRules[q.id] || {};
    const ak = answerKey[q.id];
    const method = rule.method;

    // pair_match / bucket_sort / price_country / multi_field_group はブロック単位採点
    const blockLevelMethods = ['pair_match','bucket_sort','price_country','multi_field_group'];
    const isBlockLevel = blockLevelMethods.includes(method);

    // tile_sort_buckets: bucket単位で回答と正解を並べる
    if (q.type === 'tile_sort_buckets') {
      html += renderTileSortBuckets(q, ak, userAnswers);
      html += `</div>`;
      return;
    }

    if (Array.isArray(q.sub_sections) && q.sub_sections.length) {
      q.sub_sections.forEach(sub => {
        const subRule = scoringRules[sub.sub_id] || {};
        const subAk = answerKey[sub.sub_id];
        const subMethod = subRule.method;
        const subIsBlockLevel = blockLevelMethods.includes(subMethod);
        html += `<div style="font-size:12px;font-weight:bold;color:#555;margin:8px 0 4px">${stripRuby(sub.sub_title || sub.sub_id)}</div>`;
        html += renderQuestionFieldRows(sectionType, collectFieldIds(sub), subAk, subRule, subMethod, subIsBlockLevel, sub, userAnswers, manualScores, q);
      });
    } else {
      html += renderQuestionFieldRows(sectionType, collectFieldIds(q), ak, rule, method, isBlockLevel, q, userAnswers, manualScores, q);
    }
    html += `</div>`;
  });
  return html;
}

function renderQuestionFieldRows(sectionType, fieldIds, ak, rule, method, isBlockLevel, questionBlock, userAnswers, manualScores, parentQuestion) {
  let html = '';
  const allowBinaryOverride = isBinaryManualOverrideQuestion(sectionType, parentQuestion || questionBlock);
  fieldIds.forEach((fid, idx) => {
    const userVal = userAnswers[fid];
    // 配列ak対応（test1 旧形式）
    let expected;
    if (typeof ak === 'object' && !Array.isArray(ak) && ak !== null) {
      expected = ak[fid];
    } else if (Array.isArray(ak)) {
      // index ベース（g1,g2等）
      const m = fid.match(/(\d+)$/);
      if (m) {
        const i = parseInt(m[1], 10) - 1;
        if (i >= 0 && i < ak.length) expected = ak[i];
      }
    }

    const isAnswered = userVal !== undefined && userVal !== '' && userVal !== null;
    const savedManual = manualScores && manualScores[fid];
    const hasBinaryOverride = allowBinaryOverride && savedManual && savedManual.input_mode === 'binary';
    let status = 'unanswered';
    let badge = '';
    if (hasBinaryOverride) {
      const awarded = Number(savedManual.points || 0);
      const maxPoints = Number(savedManual.max || rule.points_each || questionBlock.points_each || 0);
      status = awarded >= maxPoints ? 'correct' : 'wrong';
      badge = '<span class="badge-mn">手動採点</span>';
    } else if (method === 'manual' || (questionBlock.grading === 'manual' && (!method || method === 'manual'))) {
      status = 'manual';
      badge = '<span class="badge-mn">先生採点</span>';
    } else if (isBlockLevel && expected === undefined) {
      status = 'manual';
      badge = '<span class="badge-mn">ブロック採点</span>';
    } else if (!isAnswered) {
      status = 'unanswered';
      badge = '<span class="badge-na">未回答</span>';
    } else if (expected !== undefined) {
      const ok = matchAnswer(userVal, expected, method, rule);
      status = ok ? 'correct' : 'wrong';
      badge = ok ? '<span class="badge-ok">○</span>' : '<span class="badge-ng">×</span>';
    } else {
      status = 'manual';
      badge = '<span class="badge-mn">要確認</span>';
    }
    html += `<div class="q-item ${status}">
      <div class="qlabel">${fid} ${badge}</div>
      <div class="userAns">${escapeHtml(String(userVal ?? '(未回答)'))}</div>
      ${expected !== undefined ? `<div class="correctAns ${status==='wrong'?'wrong':''}">正解: ${escapeHtml(String(Array.isArray(expected)?expected.join(' / '):expected))}</div>` : ''}
    </div>`;
  });
  return html;
}

// grading.js と同じロジックで個別fieldをマッチ判定
function collectManualScoringItems(sections, userAnswers) {
  const secLabel = { goii: '語彙', bunpo: '文法', chokkai: '聴解' };
  const items = [];
  (sections || []).forEach(sec => {
    const rules = sec.scoring_rules || {};
    (sec.questions || []).forEach(q => {
      const rule = rules[q.id] || {};
      const isManual = rule.method === 'manual' || (q.grading === 'manual' && (!rule.method || rule.method === 'manual'));
      if (isManual) {
        const pointsEach = Number(rule.points_each || rule.points_per_field || q.points_each || 0);
        collectFieldIds(q).forEach(fid => {
          const context = buildManualQuestionContext(q, q, fid);
          items.push({
            sectionType: sec.section_type,
            sectionLabel: secLabel[sec.section_type] || sec.section_type,
            blockId: q.id,
            fieldId: fid,
            max: pointsEach,
            title: stripRuby(q.title_html || q.id),
            questionHtml: context.questionHtml,
            passageHtml: context.passageHtml,
            answer: userAnswers[fid] ?? '',
          });
        });
      }
      (q.sub_sections || []).forEach(sub => {
        const subRule = rules[sub.sub_id] || {};
        const subManual = subRule.method === 'manual' || (sub.grading === 'manual' && (!subRule.method || subRule.method === 'manual'));
        if (!subManual) return;
        const subPointsEach = Number(subRule.points_each || subRule.points_per_field || sub.points_each || q.points_each || 0);
        collectFieldIds(sub).forEach(fid => {
          const context = buildManualQuestionContext(q, sub, fid);
          items.push({
            sectionType: sec.section_type,
            sectionLabel: secLabel[sec.section_type] || sec.section_type,
            blockId: sub.sub_id,
            fieldId: fid,
            max: subPointsEach,
            title: stripRuby(q.title_html || sub.sub_title || sub.sub_id),
            questionHtml: context.questionHtml,
            passageHtml: context.passageHtml,
            answer: userAnswers[fid] ?? '',
          });
        });
      });
    });
  });
  return items;
}

function buildManualQuestionContext(parent, block, fieldId) {
  const related = findFieldContext(block, fieldId) || {};
  let questionHtml = related.label || related.question || related.prompt || related.sentence_html || related.dialogue_html || block.sub_title || parent.instruction || '';
  if (related.dialogue_html) {
    const escapedId = fieldId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    questionHtml = related.dialogue_html
      .replace(new RegExp('\\{' + escapedId + '\\}', 'g'), '<span class="manual-blank">回答欄</span>')
      .replace(/\{[^}]+\}/g, '<span class="manual-blank">　</span>');
  }
  if (!questionHtml && Array.isArray(related.words)) questionHtml = related.words.join(' / ');
  return {
    questionHtml: questionHtml || fieldId,
    passageHtml: parent.passage_html || block.passage_html || '',
  };
}

function findFieldContext(value, fieldId) {
  if (!value) return null;
  if (Array.isArray(value)) {
    for (const item of value) {
      const found = findFieldContext(item, fieldId);
      if (found) return found;
    }
    return null;
  }
  if (typeof value !== 'object') return null;
  if (value.field_id === fieldId) return value;
  if (Array.isArray(value.fields) && value.fields.some(f => f && f.field_id === fieldId)) return value;
  for (const key in value) {
    if (typeof value[key] === 'object') {
      const found = findFieldContext(value[key], fieldId);
      if (found) return found;
    }
  }
  return null;
}

function manualScoresFromResult(result) {
  const raw = result.manual_scores_json || {};
  if (typeof raw === 'string') {
    try { return JSON.parse(raw) || {}; } catch(e) { return {}; }
  }
  return raw || {};
}

function manualTotals(scores) {
  const totals = { goii: 0, bunpo: 0, chokkai: 0 };
  Object.values(scores || {}).forEach(row => {
    if (!row || !row.section_type) return;
    totals[row.section_type] = (totals[row.section_type] || 0) + (Number(row.points) || 0);
  });
  return totals;
}

function isBinaryManualOverrideQuestion(sectionType, question) {
  if (sectionType !== 'goii' || !question) return false;
  const title = stripRuby(question.title_html || question.sub_title || '');
  return title.includes('漢字をひらがなで書いてください');
}

function renderManualScoringPanel(result, items) {
  const saved = manualScoresFromResult(result);
  const previousTotals = manualTotals(saved);
  const grammarBase = Math.max(0, Number(result.score_grammar || 0) - Number(result.manual_score_grammar ?? previousTotals.bunpo ?? 0));
  const listeningBase = Math.max(0, Number(result.score_listening || 0) - Number(result.manual_score_listening ?? previousTotals.chokkai ?? 0));
  const grammarMax = items.filter(i => i.sectionType === 'bunpo').reduce((s, i) => s + i.max, 0);
  const listeningMax = items.filter(i => i.sectionType === 'chokkai').reduce((s, i) => s + i.max, 0);

  return `<div class="card manual-panel">
    <h2>手動採点</h2>
    <div class="manual-note">
      記述式・先生採点の問題だけを表示しています。保存すると自動点に加算して、文法・聴解の点数を更新します。
    </div>
    <div class="manual-summary">
      <span class="pill">文法 自動点: ${grammarBase}</span>
      <span class="pill">文法 手動: <b id="manual-bunpo-total">0</b> / ${grammarMax}</span>
      <span class="pill">聴解 自動点: ${listeningBase}</span>
      <span class="pill">聴解 手動: <b id="manual-chokkai-total">0</b> / ${listeningMax}</span>
    </div>
    <div id="manual-score-list">
      ${items.map(item => {
        const savedScore = saved[item.fieldId]?.points ?? '';
        const answer = item.answer === '' || item.answer === null || item.answer === undefined ? '(未回答)' : item.answer;
        return `<div class="manual-row" data-section="${escapeHtml(item.sectionType)}" data-field="${escapeHtml(item.fieldId)}" data-max="${item.max}">
          <div>
            <div class="fid">${escapeHtml(item.fieldId)}</div>
            <div style="font-size:11px;color:#777">${escapeHtml(item.sectionLabel)} / ${escapeHtml(item.blockId)}</div>
          </div>
          <div>
            <div style="font-size:12px;color:#555;margin-bottom:4px">${escapeHtml(item.title)}</div>
            ${item.passageHtml ? `<div class="passage">${item.passageHtml}</div>` : ''}
            <div class="question">${item.questionHtml || escapeHtml(item.fieldId)}</div>
            <div class="answer">${escapeHtml(String(answer))}</div>
          </div>
          <label style="font-size:12px;color:#555">点数 / ${item.max}<br>
            <input class="manual-score-input" type="number" min="0" max="${item.max}" step="0.5" value="${escapeHtml(String(savedScore))}" oninput="updateManualTotals()">
          </label>
        </div>`;
      }).join('')}
    </div>
    <div class="manual-save">
      <span id="manual-save-status" class="manual-note"></span>
      <button class="btn" onclick="saveManualScores()">手動採点を保存</button>
    </div>
  </div>`;
}

function matchAnswer(userVal, expected, method, rule) {
  const opts = {
    strip_accents: method === 'flex_match' || method === 'vietnamese_fuzzy',
    case_insensitive: true,
    normalize_spaces: true,
  };
  const sep = (rule && rule.separator) || '／';
  const sepRegex = new RegExp('[' + sep.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '、/,，]');

  // 期待値を配列化
  const expArr = Array.isArray(expected) ? expected : [expected];
  const expVariants = [];
  expArr.forEach(e => {
    String(e).split(sepRegex).forEach(v => {
      const n = normalizeDetail(v, opts);
      if (n) expVariants.push(n);
    });
  });
  // ユーザー回答も分割
  const actVariants = String(userVal || '').split(sepRegex)
    .map(v => normalizeDetail(v, opts))
    .filter(Boolean);
  if (!actVariants.length) return false;

  // flex_match / vietnamese_fuzzy は部分一致OK
  const allowPartial = method === 'flex_match' || method === 'vietnamese_fuzzy';
  return expVariants.some(e =>
    actVariants.some(a => a === e || (allowPartial && (a.includes(e) || e.includes(a))))
  );
}

function normalizeDetail(s, opts) {
  if (s == null) return '';
  let r = String(s).trim();
  if (opts.normalize_spaces) r = r.replace(/\s+/g, ' ');
  if (opts.case_insensitive) r = r.toLowerCase();
  if (opts.strip_accents) {
    r = r.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    r = r.replace(/đ/g, 'd').replace(/Đ/g, 'D');
  }
  return r;
}

function renderTileSortBuckets(q, ak, userAnswers) {
  const tileLabels = {};
  (q.tiles || []).forEach(t => { tileLabels[t.key] = (t.label || t.key).replace(/^[A-Z]\.\s*/, ''); });
  const expectedBuckets = Array.isArray(ak) ? ak : [];
  let html = '';
  (q.buckets || []).forEach((bk, i) => {
    const fid = bk.id;
    const userRaw = userAnswers[fid];
    let userKeys = [];
    try { userKeys = typeof userRaw === 'string' ? JSON.parse(userRaw) : (userRaw || []); }
    catch(e) { userKeys = []; }
    if (!Array.isArray(userKeys)) userKeys = [];
    const expected = expectedBuckets[i] || [];
    const userStr = userKeys.map(k => `${k.toUpperCase()}. ${tileLabels[k] || '?'}`).join(' / ') || '(未回答)';
    const expStr = expected.map(k => `${k.toUpperCase()}. ${tileLabels[k] || '?'}`).join(' / ');
    const exact = userKeys.length === expected.length && expected.every(k => userKeys.includes(k));
    const status = userKeys.length === 0 ? 'unanswered' : (exact ? 'correct' : 'wrong');
    const badge = status === 'correct' ? '<span class="badge-ok">○</span>' :
                  status === 'wrong' ? '<span class="badge-ng">×</span>' :
                  '<span class="badge-na">未回答</span>';
    html += `<div class="q-item ${status}">
      <div class="qlabel">${stripRuby(bk.label || fid)} ${badge}</div>
      <div class="userAns">${escapeHtml(userStr)}</div>
      <div class="correctAns ${status==='wrong'?'wrong':''}">正解: ${escapeHtml(expStr)}</div>
    </div>`;
  });
  return html;
}

function collectFieldIds(q) {
  const ids = [];
  function walk(o) {
    if (!o) return;
    if (Array.isArray(o)) { o.forEach(walk); return; }
    if (typeof o !== 'object') return;
    if (o.field_id && typeof o.field_id === 'string') ids.push(o.field_id);
    for (const k in o) if (typeof o[k] === 'object') walk(o[k]);
  }
  walk(q);
  // 重複除去
  return [...new Set(ids)];
}

function stripRuby(s) {
  return String(s || '').replace(/<ruby>([^<]*?)<rt>[^<]*<\/rt><\/ruby>/g, '$1');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function normalize(s) {
  return String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');
}

// ====== 誤受験除外 ======
function readManualScoreRows() {
  const rows = Array.from(document.querySelectorAll('.manual-row'));
  const scores = {};
  const totals = { goii: 0, bunpo: 0, chokkai: 0 };
  rows.forEach(row => {
    const sectionType = row.dataset.section;
    const fieldId = row.dataset.field;
    const max = Number(row.dataset.max || 0);
    const input = row.querySelector('.manual-score-input');
    const raw = input ? input.value : '';
    const points = raw === '' ? 0 : Number(raw);
    if (!Number.isFinite(points) || points < 0 || points > max) {
      throw new Error(`${fieldId} は 0〜${max} 点で入力してください`);
    }
    scores[fieldId] = { section_type: sectionType, points, max };
    totals[sectionType] = (totals[sectionType] || 0) + points;
  });
  return { scores, totals };
}

function updateManualTotals() {
  const list = document.getElementById('manual-score-list');
  if (!list) return;
  try {
    const { totals } = readManualScoreRows();
    const b = document.getElementById('manual-bunpo-total');
    const c = document.getElementById('manual-chokkai-total');
    if (b) b.textContent = totals.bunpo || 0;
    if (c) c.textContent = totals.chokkai || 0;
    const status = document.getElementById('manual-save-status');
    if (status) status.textContent = '';
  } catch (e) {
    const status = document.getElementById('manual-save-status');
    if (status) status.textContent = e.message;
  }
}

async function saveManualScores() {
  const r = window._currentResult;
  if (!r) return;
  const status = document.getElementById('manual-save-status');
  try {
    const { scores, totals } = readManualScoreRows();
    const previous = manualTotals(manualScoresFromResult(r));
    const savedGrammar = Number(r.manual_score_grammar ?? previous.bunpo ?? 0);
    const savedListening = Number(r.manual_score_listening ?? previous.chokkai ?? 0);
    const baseGrammar = Math.max(0, Number(r.score_grammar || 0) - savedGrammar);
    const baseListening = Math.max(0, Number(r.score_listening || 0) - savedListening);
    const nextGrammar = baseGrammar + (totals.bunpo || 0);
    const nextListening = baseListening + (totals.chokkai || 0);

    if (status) status.textContent = '保存中...';
    const { error } = await supabase.from('test_results')
      .update({
        score_grammar: nextGrammar,
        score_listening: nextListening,
        manual_score_grammar: totals.bunpo || 0,
        manual_score_listening: totals.chokkai || 0,
        manual_scores_json: scores,
        manually_scored_at: new Date().toISOString(),
      })
      .eq('id', RESULT_ID);

    if (error) throw error;
    if (status) status.textContent = '保存しました';
    alert('手動採点を保存しました');
    location.reload();
  } catch (e) {
    if (status) status.textContent = '保存失敗: ' + e.message;
    alert('保存に失敗しました: ' + e.message + '\n\nDB列が未追加の場合は migrations/2026_05_18_manual_scoring.sql を先に実行してください。');
  }
}

async function excludeResult() {
  const r = window._currentResult;
  if (!r) return;
  const t = r.trainees || {};
  const name = t.name_katakana || t.student_id || '?';
  const reason = prompt(`「${name}」の「${r.test_name}」を誤受験として除外します。\n\n理由を入力してください（任意）:`, '誤受験');
  if (reason === null) return;
  const { error } = await supabase.from('test_results')
    .update({ excluded: true, excluded_reason: reason || '誤受験' })
    .eq('id', RESULT_ID);
  if (error) { alert('失敗: ' + error.message); return; }
  alert('✓ 除外しました');
  location.reload();
}

async function restoreResult() {
  if (!confirm('このテスト結果を復元しますか？\n（レポート・グラフに再度反映されます）')) return;
  const { error } = await supabase.from('test_results')
    .update({ excluded: false, excluded_reason: null })
    .eq('id', RESULT_ID);
  if (error) { alert('失敗: ' + error.message); return; }
  alert('✓ 復元しました');
  location.reload();
}
